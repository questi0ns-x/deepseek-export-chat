<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Chat a Markdown</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --bd:#d8d8d8; --ac:#4d6bfe; --card:#f6f7f9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#e8e8e8; --mut:#9aa0a6; --bd:#2c3038; --card:#1c1f25; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 20px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text], textarea { width:100%; padding:10px 12px; border:1px solid var(--bd); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
  input[type=text] { flex:1 1 320px; width:auto; }
  textarea { min-height:120px; font:13px/1.4 ui-monospace,monospace; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--ac); color:#fff; font:inherit; cursor:pointer; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--bd); }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin:12px 0; min-height:1.5em; color:var(--mut); }
  #status.err { color:#d33; }
  details { margin:16px 0; border:1px solid var(--bd); border-radius:8px; padding:8px 12px; background:var(--card); }
  summary { cursor:pointer; color:var(--mut); }
  label { display:block; margin:8px 0 4px; font-size:.9rem; color:var(--mut); }
  #out { display:none; margin-top:20px; }
  #out pre { white-space:pre-wrap; word-break:break-word; max-height:480px; overflow:auto; background:var(--card); border:1px solid var(--bd); border-radius:8px; padding:12px; font:13px/1.45 ui-monospace,monospace; }
</style>
</head>
<body>
<main>
  <h1>DeepSeek Chat a Markdown</h1>
  <p class="sub">Pega un link público <code>chat.deepseek.com/share/…</code> y descarga el chat como <code>.md</code>.</p>

  <div class="row">
    <input id="url" type="text" placeholder="https://chat.deepseek.com/share/xxxxxxxxxxxx" autocomplete="off">
    <button id="go">Cargar</button>
  </div>
  <div id="status" role="status"></div>

  <details id="opts">
    <summary>Opciones</summary>
    <label for="proxy">URL del proxy (Cloudflare Worker)</label>
    <input id="proxy" type="text" placeholder="https://tu-worker.tu-usuario.workers.dev/">
    <label><input id="think" type="checkbox" checked> Incluir razonamiento (thinking)</label>
    <label><input id="refs" type="checkbox" checked> Incluir fuentes de búsqueda</label>
  </details>

  <details id="manual">
    <summary>Plan B: pegar JSON a mano</summary>
    <p class="sub">Abre <code>https://chat.deepseek.com/api/v0/share/content?share_id=TU_ID</code> en otra pestaña, copia todo y pégalo aquí.</p>
    <textarea id="raw" placeholder='{"code":0,"data":{...}}'></textarea>
    <div class="row" style="margin-top:8px"><button id="conv" class="sec">Convertir JSON</button></div>
  </details>

  <section id="out">
    <div class="row">
      <button id="dl">Descargar .md</button>
      <button id="cp" class="sec">Copiar</button>
    </div>
    <pre id="md"></pre>
  </section>
</main>

<script>
// Pon aquí la URL de tu Worker para no escribirla cada vez.
const DEFAULT_PROXY = "https://red-dust-d309.questi0ns-x.workers.dev/";

const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k) } catch { return null } },
  set(k,v){ try { localStorage.setItem(k,v) } catch {} }
};
$("proxy").value = store.get("proxy") || DEFAULT_PROXY;
$("think").checked = store.get("think") !== "0";
$("refs").checked = store.get("refs") !== "0";

let current = { title: "chat", md: "" };

function status(msg, err){ const s=$("status"); s.textContent=msg; s.className = err ? "err" : ""; }

function parseId(input){
  const t = input.trim();
  const m = t.match(/share\/([A-Za-z0-9_-]+)/) || t.match(/^([A-Za-z0-9_-]{6,64})$/);
  return m ? m[1] : null;
}

async function fetchShare(id){
  const proxy = $("proxy").value.trim();
  const target = proxy
    ? proxy + (proxy.includes("?") ? "&" : (proxy.endsWith("/") ? "?" : "/?")) + "share_id=" + encodeURIComponent(id)
    : "https://chat.deepseek.com/api/v0/share/content?share_id=" + encodeURIComponent(id);
  const r = await fetch(target);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function toMarkdown(json, opts){
  const root = json?.data?.biz_data ?? json?.biz_data ?? json?.data ?? json;
  const msgs = root?.messages;
  if (!Array.isArray(msgs)) throw new Error("Formato inesperado: no hay 'messages'");
  const title = root.title && root.title !== "Shared Conversation" ? root.title : "Conversación DeepSeek";
  const out = ["# " + title, ""];
  for (const m of msgs){
    const isUser = String(m.role).toUpperCase() === "USER";
    out.push("## " + (isUser ? "Usuario" : "DeepSeek"), "");
    for (const f of (m.fragments || [])){
      const t = String(f.type || "").toUpperCase();
      const c = String(f.content ?? "").replace(/\s+$/,"");
      if (t === "THINK" || t === "THINKING"){
        if (opts.think && c) out.push("<details><summary>Razonamiento</summary>", "", c, "", "</details>", "");
      } else if (c){
        out.push(c, "");
      }
      if (opts.refs && Array.isArray(f.references) && f.references.length){
        out.push("**Fuentes:**", "");
        for (const r of f.references){
          const u = r.url || r.link || "";
          if (u) out.push("- [" + String(r.title || u).replace(/\n/g," ") + "](" + u + ")");
        }
        out.push("");
      }
    }
  }
  return { title, md: out.join("\n").replace(/\n{3,}/g,"\n\n").trim() + "\n" };
}

function show(json){
  const res = toMarkdown(json, { think: $("think").checked, refs: $("refs").checked });
  current = res;
  $("md").textContent = res.md;
  $("out").style.display = "block";
  status("Listo: " + res.md.length + " caracteres.");
}

$("go").onclick = async () => {
  const id = parseId($("url").value);
  if (!id){ status("Link no válido.", true); return; }
  store.set("proxy", $("proxy").value.trim());
  store.set("think", $("think").checked ? "1":"0");
  store.set("refs", $("refs").checked ? "1":"0");
  $("go").disabled = true; status("Cargando…");
  try {
    const json = await fetchShare(id);
    const biz = json?.data;
    if (biz && biz.biz_code !== 0) throw new Error(biz.biz_msg || "share no existe o es privado");
    show(json);
  } catch (e) {
    const cors = !$("proxy").value.trim() || /Failed to fetch|NetworkError/i.test(e.message);
    status("Error: " + e.message + (cors ? " — el navegador bloquea la llamada directa (CORS). Configura el proxy en Opciones o usa el plan B." : ""), true);
    $("opts").open = true;
  } finally { $("go").disabled = false; }
};
$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

$("conv").onclick = () => {
  try { show(JSON.parse($("raw").value)); } catch (e) { status("JSON inválido: " + e.message, true); }
};

$("dl").onclick = () => {
  const name = current.title.replace(/[\\/:*?"<>|]+/g,"").trim().slice(0,80) || "chat";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([current.md], { type: "text/markdown;charset=utf-8" }));
  a.download = name + ".md";
  a.click(); URL.revokeObjectURL(a.href);
};
$("cp").onclick = async () => {
  try { await navigator.clipboard.writeText(current.md); status("Copiado."); } catch { status("No se pudo copiar.", true); }
};
</script>
</body>
</html>
